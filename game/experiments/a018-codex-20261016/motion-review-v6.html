<!doctype html><meta charset="utf-8"><title>A018 armed v6 motion review</title><style>body{background:#222;color:white;font:13px sans-serif}h1{font-size:18px}canvas{width:256px;height:256px;image-rendering:pixelated;background:#555}button,select{font-size:13px;margin:4px}</style><h1>A018 武器あり v6 動作確認</h1><p>候補・未承認。接地線238px、16コマ。ゲーム組み込みは別工程。</p><button id="play">停止</button><button id="prev">前</button><button id="next">次</button><select id="speed" aria-label="fps"><option>10</option><option selected>15</option><option>20</option></select>fps <span id="status"></span><br><canvas id="c" width="512" height="512"></canvas><script>let im=new Image, f=0,run=true,last=0,cycles=0;im.src='armed16-frame13-contact-trial-v6.png';let c=document.querySelector('canvas'),ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;function draw(){ctx.fillStyle='#555';ctx.fillRect(0,0,512,512);ctx.drawImage(im,f*256,0,256,256,0,0,512,512);ctx.strokeStyle='#00ffff';ctx.beginPath();ctx.moveTo(0,478);ctx.lineTo(512,478);ctx.stroke();document.querySelector('#status').textContent='frame '+(f+1)+'/16 · cycles '+cycles;}document.querySelector('#play').onclick=()=>{run=!run;document.querySelector('#play').textContent=run?'停止':'再生'};document.querySelector('#prev').onclick=()=>{run=false;f=(f+15)%16;draw()};document.querySelector('#next').onclick=()=>{run=false;f=(f+1)%16;draw()};function tick(t){if(im.complete&&im.naturalWidth&&run&&t-last>=1000/Number(document.querySelector('#speed').value)){f=(f+1)%16;if(f===0)cycles++;last=t;draw()}requestAnimationFrame(tick)}im.onload=()=>{draw();requestAnimationFrame(tick)};</script>
