<!doctype html><meta charset="utf-8"><title>A023 motion review</title><style>body{background:#222;color:white;font:13px sans-serif}canvas{image-rendering:pixelated;max-width:100%;height:auto}h1{font-size:18px}button{margin:4px}</style><h1>A023 動作候補</h1><p>素材候補。実ゲーム・実機は未確認。</p><button id="play">停止</button><button id="next">次のコマ</button><span id="status"></span><br><canvas id="c" width="512" height="384"></canvas><br><canvas id="g" width="256" height="384" style="height:256px;width:auto"></canvas><script>let f=0,r=true,last=0,cycles=0;let a=new Image,b=new Image;a.src='cannon-strip-candidate-v4.png';b.src='commander-strip-candidate-v3.png';let c=document.querySelector('#c'),g=document.querySelector('#g'),x=c.getContext('2d'),y=g.getContext('2d');function draw(){x.drawImage(a,f*512,0,512,384,0,0,512,384);y.drawImage(b,f*256,0,256,384,0,0,256,384);document.querySelector('#status').textContent='frame '+(f+1)+'/4 cycles '+cycles}document.querySelector('#play').onclick=()=>{r=!r;document.querySelector('#play').textContent=r?'停止':'再生'};document.querySelector('#next').onclick=()=>{r=false;f=(f+1)%4;draw()};function tick(t){if(a.complete&&b.complete&&a.naturalWidth&&b.naturalWidth&&r&&t-last>[400,300,160,600][f]){f=(f+1)%4;if(f===0)cycles++;last=t;draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);</script>
