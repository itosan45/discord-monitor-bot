<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<style>
html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none;overscroll-behavior:none}
#wrap{position:fixed;left:0;top:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#000}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;overflow:hidden;background:#222}
#stage canvas{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
#touch{position:absolute;left:0;top:0;width:1280px;height:720px;display:none;pointer-events:none}
body.touch.playing #touch{display:block}
#touch .btn{position:absolute;border-radius:50%;pointer-events:auto;display:flex;align-items:center;justify-content:center;
  font:900 38px/1 "Arial Black",Impact,sans-serif;color:#fff;text-shadow:0 2px 4px #000;border:5px solid rgba(255,255,255,.55);
  background:rgba(255,255,255,.14);box-shadow:0 0 18px rgba(0,0,0,.5) inset;touch-action:none}
#touch .btn.on{filter:brightness(1.8);transform:scale(.93)}
#bP{left:1010px;top:520px;width:130px;height:130px;background:rgba(230,60,60,.38)}
#bK{left:1130px;top:395px;width:130px;height:130px;background:rgba(60,130,240,.38)}
#bG{left:880px;top:560px;width:120px;height:120px;background:rgba(60,200,110,.38)}
#bT{left:1150px;top:560px;width:100px;height:100px;font-size:22px;background:rgba(240,190,50,.38)}
#bS{left:40px;top:330px;width:90px;height:90px;font-size:26px;background:rgba(200,200,255,.25)}
#zoneL{position:absolute;left:0;top:140px;width:640px;height:580px;pointer-events:auto;touch-action:none}
#stickBase{position:absolute;width:190px;height:190px;border-radius:50%;border:5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.1);display:none;margin:-95px 0 0 -95px;pointer-events:none}
#stickKnob{position:absolute;width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.55);left:53px;top:53px}
#stickHint{position:absolute;left:60px;top:560px;width:220px;color:rgba(255,255,255,.55);font:700 20px sans-serif;text-align:center;pointer-events:none}
.ibtn{position:absolute;width:64px;height:64px;border-radius:14px;background:rgba(0,0,0,.45);color:#fff;font:700 30px/64px sans-serif;text-align:center;
  border:2px solid rgba(255,255,255,.4);pointer-events:auto;touch-action:none;display:none}
body.touch .ibtn,.ibtn.always{display:block}
#bSnd{left:1196px;top:96px}#bFs{left:1196px;top:170px}
#rotate{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.88);color:#fff;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;
  font:700 22px sans-serif;text-align:center;padding:20px;pointer-events:none}
#rotate div{font-size:60px;margin-bottom:12px;animation:rot 1.6s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
#err{position:absolute;left:0;top:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;color:#fff;font:700 28px sans-serif;text-align:center;background:#112}
</style>
</head>
<body>
<div id="wrap">
 <div id="stage">
  <canvas id="gl" width="1280" height="720"></canvas>
  <canvas id="hud" width="1280" height="720"></canvas>
  <div id="touch">
   <div id="zoneL"></div>
   <div id="stickBase"><div id="stickKnob"></div></div>
   <div id="stickHint">◀▶ 移動　▲ 回り込み　▼ しゃがみ</div>
   <div class="btn" id="bS">回込</div>
   <div class="btn" id="bG">G</div>
   <div class="btn" id="bP">P</div>
   <div class="btn" id="bK">K</div>
   <div class="btn" id="bT">投げ</div>
  </div>
  <div class="ibtn" id="bSnd">♪</div>
  <div class="ibtn" id="bFs">⛶</div>
  <div id="err">three.js を読み込めませんでした。<br>ネットワーク接続を確認して再読み込みしてください。</div>
 </div>
</div>
<div id="rotate"><div>📱</div>横向きにしてください<br>(画面を横にすると遊べます)</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
(function(){
if(typeof THREE==='undefined'){document.getElementById('err').style.display='flex';return;}

/* =========================================================
   ZENITH FIGHTERS  -  single file 3D fighting game
   ========================================================= */
const W=1280,H=720,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const angDiff=(a,b)=>{let d=b-a;while(d>PI)d-=2*PI;while(d<-PI)d+=2*PI;return d;};
const rnd=Math.random;
const RING=4.5, ROUND_TIME=45, GRAV=22;
const IS_TOUCH=('ontouchstart' in window)||(navigator.maxTouchPoints>0);
if(IS_TOUCH)document.body.classList.add('touch');

/* ---------------- Audio (all synthesised) ---------------- */
const Sfx=(()=>{
  let ac=null,master,noiseBuf,musicGain,muted=false,musicTimer=null,step=0,nextT=0;
  function init(){
    try{
      if(ac){if(ac.state==='suspended')ac.resume();return;}
      ac=new (window.AudioContext||window.webkitAudioContext)();
      master=ac.createGain();master.gain.value=muted?0:.7;master.connect(ac.destination);
      noiseBuf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);
      const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
      musicGain=ac.createGain();musicGain.gain.value=.22;musicGain.connect(master);
      nextT=ac.currentTime+.1;musicTimer=setInterval(music,60);
    }catch(e){ac=null;}
  }
  function env(g,t,a,d,pk){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(pk,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
  function noise(dur,f0,f1,vol,q,type,delay,dest){
    if(!ac)return;try{
    const t=ac.currentTime+(delay||0);const s=ac.createBufferSource();s.buffer=noiseBuf;s.loop=true;
    const f=ac.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(f0,t);
    f.frequency.exponentialRampToValueAtTime(Math.max(40,f1),t+dur);f.Q.value=q||.8;
    const g=ac.createGain();env(g,t,.004,dur,vol);s.connect(f);f.connect(g);g.connect(dest||master);s.start(t);s.stop(t+dur+.05);}catch(e){}
  }
  function tone(f0,f1,dur,vol,type,delay,dest){
    if(!ac)return;try{
    const t=ac.currentTime+(delay||0);const o=ac.createOscillator();o.type=type||'sine';
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    const g=ac.createGain();env(g,t,.004,dur,vol);o.connect(g);g.connect(dest||master);o.start(t);o.stop(t+dur+.05);}catch(e){}
  }
  // simple taiko + pentatonic loop
  const SCALE=[293.7,349.2,392,440,523.3,587.3,698.5];
  const MEL=[0,-1,2,-1,3,-1,2,-1, 4,-1,3,-1,2,-1,1,-1, 0,-1,2,-1,3,-1,5,-1, 4,-1,3,2,1,-1,0,-1];
  function music(){
    if(!ac||muted)return;
    while(nextT<ac.currentTime+.25){
      const s=step%32, t=nextT, dl=t-ac.currentTime;
      if(s%4===0){tone(130,48,.28,.9,'sine',dl,musicGain);noise(.06,900,200,.5,1,'bandpass',dl,musicGain);}
      if(s%8===6){tone(95,40,.22,.7,'sine',dl,musicGain);}
      if(s%2===1&&s%8!==7)noise(.03,6000,5000,.18,3,'highpass',dl,musicGain);
      const m=MEL[s];
      if(m>=0){const f=SCALE[m];tone(f,f*.995,.32,.35,'triangle',dl,musicGain);tone(f*2,f*2,.2,.1,'sine',dl,musicGain);}
      if(s%16===0){tone(73.4,73.4,1.2,.35,'sawtooth',dl,musicGain);}
      nextT+=.15;step++;
    }
  }
  return{
    init,
    toggle(){muted=!muted;if(master)master.gain.value=muted?0:.7;return muted;},
    get muted(){return muted;},
    whoosh(p){noise(.16,500,2600,.22*(p||1),1.2);},
    hit(p){p=p||1;noise(.12,3200,300,.55*p,.9);tone(170,50,.16,.8*p,'sine');if(p>1.2){tone(80,30,.35,.9,'sine');noise(.25,1200,90,.6,.6,'lowpass');}},
    block(){noise(.07,4500,1500,.35,2);tone(480,300,.07,.22,'square');},
    kiai(hi){tone(hi?420:330,hi?250:190,.2,.1,'sawtooth');noise(.18,1400,700,.15,2);},
    land(){noise(.2,700,70,.7,.7,'lowpass');tone(90,40,.2,.6,'sine');},
    gong(){tone(110,104,1.8,.6,'sine');tone(221,215,1.4,.25,'sine');tone(331,325,1,.15,'sine');noise(.4,2000,300,.3,1);},
    bell(){tone(880,870,.5,.22,'sine');tone(1320,1310,.4,.1,'sine');},
    fight(){tone(220,330,.25,.3,'sawtooth');tone(110,110,.4,.5,'square');noise(.3,3000,800,.3,1);},
    fall(){tone(500,60,1.1,.3,'sine');},
    ui(){tone(900,1300,.08,.2,'square');}
  };
})();

/* ---------------- renderer / scene ---------------- */
const glCanvas=document.getElementById('gl'),hudCanvas=document.getElementById('hud');
const renderer=new THREE.WebGLRenderer({canvas:glCanvas,antialias:true,powerPreference:'high-performance'});
renderer.setClearColor(0xe9a98b);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xe9b090,40,300);
const camera=new THREE.PerspectiveCamera(36,W/H,.1,900);
const hud=hudCanvas.getContext('2d');
let PR=1;
const stageEl=document.getElementById('stage');
function resize(){
  const iw=window.innerWidth,ih=window.innerHeight;
  const s=Math.min(iw/W,ih/H);
  stageEl.style.transform='translate('+((iw-W*s)/2)+'px,'+((ih-H*s)/2)+'px) scale('+s+')';
  stageEl._s=s;
  const dpr=window.devicePixelRatio||1;
  PR=clamp(s*dpr,.6,1.6);
  if(IS_TOUCH)PR=Math.min(PR,1.15);
  PR=Math.max(.5,PR*(window.__q||1));
  renderer.setPixelRatio(PR);renderer.setSize(W,H,false);
  hudCanvas.width=Math.round(W*PR);hudCanvas.height=Math.round(H*PR);
  glCanvas.style.width=W+'px';glCanvas.style.height=H+'px';
  hudCanvas.style.width=W+'px';hudCanvas.style.height=H+'px';
  document.getElementById('rotate').style.display=(ih>iw*1.05)?'flex':'none';
}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
resize();

function canvasTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}

/* sky */
const skyTex=canvasTex(8,512,(g,w,h)=>{
  const gr=g.createLinearGradient(0,0,0,h);
  gr.addColorStop(0,'#2a2d6e');gr.addColorStop(.3,'#6a4c93');gr.addColorStop(.46,'#e0707f');gr.addColorStop(.5,'#f7b27a');gr.addColorStop(.56,'#ffd9a0');gr.addColorStop(1,'#e9b090');
  g.fillStyle=gr;g.fillRect(0,0,w,h);
});
const sky=new THREE.Mesh(new THREE.SphereGeometry(700,24,16),new THREE.MeshBasicMaterial({map:skyTex,side:THREE.BackSide,fog:false,depthWrite:false}));
scene.add(sky);
const sunTex=canvasTex(128,128,(g)=>{const gr=g.createRadialGradient(64,64,0,64,64,64);gr.addColorStop(0,'rgba(255,250,220,1)');gr.addColorStop(.25,'rgba(255,220,150,.9)');gr.addColorStop(1,'rgba(255,160,100,0)');g.fillStyle=gr;g.fillRect(0,0,128,128);});
const sun=new THREE.Sprite(new THREE.SpriteMaterial({map:sunTex,fog:false,depthWrite:false,transparent:true}));
sun.scale.set(180,180,1);sun.position.set(-260,95,-420);scene.add(sun);

/* lights */
scene.add(new THREE.HemisphereLight(0xfff0e0,0x5a4a6a,.85));
const dl=new THREE.DirectionalLight(0xffe0bd,.95);dl.position.set(-6,10,8);scene.add(dl);
const dl2=new THREE.DirectionalLight(0x9ab4ff,.35);dl2.position.set(7,5,-8);scene.add(dl2);

/* ring floor texture */
const floorTex=canvasTex(1024,1024,(g,w,h)=>{
  g.fillStyle='#3d414f';g.fillRect(0,0,w,h);
  const n=8,ts=w/n;
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    const v=((i+j)&1)?'#464a59':'#393d4a';g.fillStyle=v;g.fillRect(i*ts+2,j*ts+2,ts-4,ts-4);
  }
  for(let i=0;i<4000;i++){g.fillStyle='rgba(255,255,255,'+(Math.random()*.05)+')';g.fillRect(Math.random()*w,Math.random()*h,2,2);}
  // emblem
  g.save();g.translate(w/2,h/2);
  g.strokeStyle='rgba(230,190,90,.85)';g.lineWidth=10;g.beginPath();g.arc(0,0,250,0,PI*2);g.stroke();
  g.lineWidth=4;g.beginPath();g.arc(0,0,214,0,PI*2);g.stroke();
  g.fillStyle='rgba(230,190,90,.8)';
  for(let k=0;k<8;k++){g.save();g.rotate(k*PI/4);g.beginPath();g.moveTo(0,-130);g.lineTo(26,-60);g.lineTo(-26,-60);g.closePath();g.fill();g.beginPath();g.moveTo(0,-210);g.lineTo(14,-170);g.lineTo(-14,-170);g.closePath();g.fill();g.restore();}
  g.beginPath();g.arc(0,0,48,0,PI*2);g.fill();g.fillStyle='#3d414f';g.beginPath();g.arc(0,0,30,0,PI*2);g.fill();
  g.restore();
  // border
  g.strokeStyle='#b3202c';g.lineWidth=46;g.strokeRect(0,0,w,h);
  g.strokeStyle='#f2e6c8';g.lineWidth=6;g.strokeRect(46,46,w-92,h-92);
});
const stoneMat=new THREE.MeshPhongMaterial({color:0x6a6d78,shininess:6});
const darkMat=new THREE.MeshPhongMaterial({color:0x2c2a36});
const redMat=new THREE.MeshPhongMaterial({color:0xb3202c,shininess:30});
const platform=new THREE.Mesh(new THREE.BoxGeometry(RING*2,.7,RING*2),[stoneMat,stoneMat,new THREE.MeshPhongMaterial({map:floorTex,shininess:25,specular:0x333333}),stoneMat,stoneMat,stoneMat]);
platform.position.y=-.35;scene.add(platform);
const pedestal=new THREE.Mesh(new THREE.BoxGeometry(RING*2-.8,10,RING*2-.8),new THREE.MeshPhongMaterial({color:0x4a4a58,shininess:4}));
pedestal.position.y=-5.7;scene.add(pedestal);
// corner posts with lanterns
const lanternMat=new THREE.MeshBasicMaterial({color:0xffc060});
for(const sx of[-1,1])for(const sz of[-1,1]){
  const g=new THREE.Group();g.position.set(sx*(RING+.15),0,sz*(RING+.15));
  const post=new THREE.Mesh(new THREE.CylinderGeometry(.14,.18,.4,8),redMat);post.position.y=.2;g.add(post);
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(.22,.16,.08,8),darkMat);cap.position.y=.44;g.add(cap);
  const lan=new THREE.Mesh(new THREE.SphereGeometry(.14,10,8),lanternMat);lan.position.y=.62;lan.scale.y=1.2;g.add(lan);
  scene.add(g);
}
// sea
const sea=new THREE.Mesh(new THREE.PlaneGeometry(1600,1600,1,1),new THREE.MeshPhongMaterial({color:0x2f5f80,shininess:80,specular:0xffcc99}));
sea.rotation.x=-PI/2;sea.position.y=-9;scene.add(sea);
// scenery ring
(function(){
  const mm=(c)=>new THREE.MeshPhongMaterial({color:c,flatShading:true,shininess:2});
  for(let i=0;i<22;i++){
    const a=i/22*PI*2+rnd()*.2,r=130+rnd()*90,h=22+rnd()*40,rad=22+rnd()*26;
    const m=new THREE.Mesh(new THREE.ConeGeometry(rad,h,6+((rnd()*3)|0)),mm(new THREE.Color().setHSL(.72,.25,.3+rnd()*.12)));
    m.position.set(Math.cos(a)*r,h/2-9,Math.sin(a)*r);m.rotation.y=rnd()*3;scene.add(m);
  }
  const roofMat=mm(0x3a2e3e),wallMat=mm(0xd9c9a8),redM=mm(0xb3202c),woodM=mm(0x5a3a2a);
  function pagoda(x,z,s,tiers){
    const g=new THREE.Group();let y=0;
    for(let i=0;i<tiers;i++){
      const w=(5-i*.7)*s;
      const b=new THREE.Mesh(new THREE.BoxGeometry(w*.7,2.2*s,w*.7),wallMat);b.position.y=y+1.1*s;g.add(b);
      const r=new THREE.Mesh(new THREE.ConeGeometry(w*.95,1.6*s,4),roofMat);r.rotation.y=PI/4;r.position.y=y+3*s;g.add(r);
      y+=3*s;
    }
    const sp=new THREE.Mesh(new THREE.CylinderGeometry(.08*s,.08*s,3*s,4),woodM);sp.position.y=y+1.2*s;g.add(sp);
    g.position.set(x,-9+0,z);g.position.y=-9;
    const base=new THREE.Mesh(new THREE.BoxGeometry(7*s,9,7*s),mm(0x555560));base.position.y=4.5;g.add(base);
    g.children.forEach(c=>{if(c!==base)c.position.y+=9;});
    scene.add(g);
  }
  pagoda(-34,-40,2.2,5);pagoda(48,-58,1.8,3);pagoda(-62,22,1.6,3);pagoda(40,50,2,4);pagoda(0,-85,2.6,5);pagoda(75,0,1.7,3);pagoda(-20,70,1.5,3);
  function torii(x,z,ry,s){
    const g=new THREE.Group();
    for(const sx of[-1,1]){const p=new THREE.Mesh(new THREE.CylinderGeometry(.35*s,.42*s,7*s,8),redM);p.position.set(sx*3*s,3.5*s,0);g.add(p);}
    const t1=new THREE.Mesh(new THREE.BoxGeometry(9.4*s,.6*s,.8*s),mm(0x222222));t1.position.y=7.2*s;g.add(t1);
    const t2=new THREE.Mesh(new THREE.BoxGeometry(7.4*s,.45*s,.55*s),redM);t2.position.y=5.8*s;g.add(t2);
    g.position.set(x,-9,z);g.rotation.y=ry;g.position.y=-9+0;
    const base=new THREE.Mesh(new THREE.BoxGeometry(12*s,9,4*s),mm(0x555560));base.position.y=-4.5+9-9+0;g.add(base);base.position.y=-4.5+4.5;
    scene.add(g);
  }
  torii(18,-30,0,1.3);torii(-30,18,PI/2,1.3);torii(32,22,-PI/3,1.2);
  // cherry trees on small islets
  const trunkM=mm(0x4a3426),leafM=[mm(0xf6a9c4),mm(0xf4b8d0),mm(0xee94b6)];
  function tree(x,z,s){
    const g=new THREE.Group();g.position.set(x,-9,z);
    const isl=new THREE.Mesh(new THREE.CylinderGeometry(3.4*s,4.2*s,9,8),mm(0x5c5a66));isl.position.y=4.5;g.add(isl);
    const tr=new THREE.Mesh(new THREE.CylinderGeometry(.35*s,.55*s,4*s,6),trunkM);tr.position.y=9+2*s;g.add(tr);
    for(let i=0;i<5;i++){const l=new THREE.Mesh(new THREE.SphereGeometry((1.5+rnd()*1.1)*s,8,6),leafM[i%3]);l.position.set((rnd()-.5)*3*s,9+(3.6+rnd()*1.6)*s,(rnd()-.5)*3*s);g.add(l);}
    scene.add(g);
  }
  tree(-26,-26,1.4);tree(28,-30,1.6);tree(-30,18,1.3);tree(31,22,1.5);tree(0,-42,1.8);tree(-16,38,1.2);
  // clouds
  const cloudTex=canvasTex(128,64,(g)=>{const gr=g.createRadialGradient(64,32,2,64,32,60);gr.addColorStop(0,'rgba(255,230,220,.85)');gr.addColorStop(1,'rgba(255,200,190,0)');g.fillStyle=gr;g.fillRect(0,0,128,64);});
  for(let i=0;i<16;i++){const s=new THREE.Sprite(new THREE.SpriteMaterial({map:cloudTex,transparent:true,depthWrite:false,fog:false,opacity:.8}));
    const a=rnd()*PI*2,r=300+rnd()*150;s.position.set(Math.cos(a)*r,40+rnd()*70,Math.sin(a)*r);s.scale.set(140+rnd()*120,45+rnd()*25,1);scene.add(s);}
})();
// petals
const PET_N=260,petalPos=new Float32Array(PET_N*3),petalV=[];
for(let i=0;i<PET_N;i++){petalPos[i*3]=(rnd()-.5)*30;petalPos[i*3+1]=rnd()*9;petalPos[i*3+2]=(rnd()-.5)*30;petalV.push([rnd()*.6+.2,rnd()*.5+.3,rnd()*6]);}
const petalGeo=new THREE.BufferGeometry();petalGeo.setAttribute('position',new THREE.BufferAttribute(petalPos,3));
const petals=new THREE.Points(petalGeo,new THREE.PointsMaterial({color:0xffc2d6,size:.11,transparent:true,opacity:.9,depthWrite:false}));
petals.frustumCulled=false;scene.add(petals);

/* sparks */
const sparkTex=canvasTex(128,128,(g)=>{

  g.fillStyle=gr;g.beginPath();for(let i=0;i<16;i++){const a=i/16*PI*2,r=i%2?18:62;g.lineTo(Math.cos(a)*r,Math.sin(a)*r);}g.closePath();g.fill();

const ringTex=canvasTex(128,128,(g)=>{g.strokeStyle='rgba(255,255,255,.9)';g.lineWidth=8;g.beginPath();g.arc(64,64,52,0,PI*2);g.stroke();});

  const m=new THREE.SpriteMaterial({map:sparkTex,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false,fog:false});
  const s=new THREE.Sprite(m);s.visible=false;scene.add(s);FX.push({s,t:1,life:.2,size:1,flat:false});

function spark(x,y,z,color,size,life,ring){
  let f=FX.find(e=>e.t>=e.life);if(!f)f=FX[0];
  f.t=0;f.life=life||.22;f.size=size||1;f.s.position.set(x,y,z);f.s.material.color.set(color||0xffffff);
  f.s.material.map=ring?ringTex:sparkTex;f.s.material.rotation=rnd()*6;f.s.visible=true;f.s.scale.set(.1,.1,1);
}
function updateFx(dt){
  for(const f of FX){if(f.t>=f.life){f.s.visible=false;continue;}
    f.t+=dt;const p=f.t/f.life;const sc=f.size*(.4+p*1.2)*(p>.6?(1-(p-.6)/.4*.8):1);
    f.s.scale.set(sc,sc,1);f.s.material.opacity=1-p*p;}
}

}

function lerpPose(out,a,b,t){for(let i=0;i<NP;i++)out[i]=a[i]+(b[i]-a[i])*t;return out;}
function sampleAnim(anim,t,out){
  if(t<=anim[0][0]){const a=P[anim[0][1]];for(let i=0;i<NP;i++)out[i]=a[i];return out;}
  for(let k=1;k<anim.length;k++){
    if(t<=anim[k][0]){const t0=anim[k-1][0],t1=anim[k][0];return lerpPose(out,P[anim[k-1][1]],P[anim[k][1]],sstep((t-t0)/(t1-t0)));}
  }
  const a=P[anim[anim.length-1][1]];for(let i=0;i<NP;i++)out[i]=a[i];return out;
}

/* ---------------- Fighter model ---------------- */
function buildModel(def){
  const bulk=def.bulk||1;
  const M=c=>new THREE.MeshPhongMaterial({color:c,shininess:14});
  const skin=M(def.skin),top=M(def.top),pant=M(def.pant),belt=M(def.belt),hair=M(def.hair),dark=M(0x111111);
  const root=new THREE.Group(),body=new THREE.Group();root.add(body);body.scale.setScalar(def.scale||1);
  const mesh=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x||0,y||0,z||0);return m;};
  const cyl=(a,b,h,s)=>new THREE.CylinderGeometry(a,b,h,s||10);
  const pelvis=new THREE.Group();pelvis.position.y=.95;body.add(pelvis);
  pelvis.add(mesh(new THREE.BoxGeometry(.36*bulk,.2,.23),pant,0,-.03,0));
  pelvis.add(mesh(cyl(.19*bulk,.19*bulk,.09,12),belt,0,.09,0));
  const knot=mesh(new THREE.BoxGeometry(.08,.08,.05),belt,0,.08,.18*bulk);pelvis.add(knot);
  for(const sx of[-1,1]){const tl=mesh(new THREE.BoxGeometry(.04,.3,.02),belt,sx*.05,-.06,.19*bulk);tl.rotation.z=sx*.15;pelvis.add(tl);}
  const torso=new THREE.Group();torso.position.y=.1;pelvis.add(torso);
  const chest=mesh(cyl(.21*bulk,.17*bulk,.5,12),top,0,.27,0);chest.scale.z=.72;torso.add(chest);
  const chestC=new THREE.Object3D();chestC.position.set(0,.27,0);torso.add(chestC);
  // gi collar V
  const vv=mesh(new THREE.BoxGeometry(.1,.2,.02),skin,0,.4,.15*bulk);vv.rotation.z=0;torso.add(vv);
  for(const sx of[-1,1]){const c=mesh(new THREE.BoxGeometry(.05,.26,.03),top,sx*.06,.4,.155*bulk);c.rotation.z=-sx*.35;torso.add(c);}
  const head=new THREE.Group();head.position.set(0,.5,0);torso.add(head);
  head.add(mesh(cyl(.05,.06,.12,8),skin,0,.04,0));
  const skull=mesh(new THREE.SphereGeometry(.125,14,12),skin,0,.18,0);skull.scale.set(1,1.08,1.02);head.add(skull);
  const headC=new THREE.Object3D();headC.position.set(0,.18,0);head.add(headC);
  for(const sx of[-1,1]){head.add(mesh(new THREE.BoxGeometry(.04,.022,.02),dark,sx*.05,.2,.118));
    const br=mesh(new THREE.BoxGeometry(.06,.014,.02),hair,sx*.05,.235,.116);br.rotation.z=-sx*.2;head.add(br);}
  head.add(mesh(new THREE.BoxGeometry(.05,.012,.02),M(0x8a3a3a),0,.13,.12));
  if(def.style==='spiky'){
    const cap=mesh(new THREE.SphereGeometry(.132,12,8,0,PI*2,0,PI*.55),hair,0,.19,-.005);head.add(cap);
    for(let i=0;i<7;i++){const a=(i/7-.5)*2.4;const sp=mesh(new THREE.ConeGeometry(.05,.17,5),hair,Math.sin(a)*.11,.3,-.02-Math.cos(a)*.05);sp.rotation.z=-Math.sin(a)*.8;sp.rotation.x=-.5;head.add(sp);}
    const hb=mesh(cyl(.133,.133,.035,12),M(def.band||0xd32525),0,.24,0);head.add(hb);
    for(const sx of[-1,1]){const t=mesh(new THREE.BoxGeometry(.03,.2,.01),M(def.band||0xd32525),sx*.03,.2,-.14);t.rotation.z=sx*.3;head.add(t);}
  }else if(def.style==='bald'){
    head.add(mesh(new THREE.BoxGeometry(.16,.07,.05),M(0x2a2018),0,.1,.1));
    head.add(mesh(new THREE.BoxGeometry(.1,.05,.03),M(0x2a2018),0,.15,.125));
  }else{
    const cap=mesh(new THREE.SphereGeometry(.135,12,8,0,PI*2,0,PI*.62),hair,0,.19,-.01);head.add(cap);
    const fr=mesh(new THREE.BoxGeometry(.2,.05,.04),hair,0,.26,.09);head.add(fr);
    const pg=new THREE.Group();pg.position.set(0,.26,-.12);pg.rotation.x=.6;head.add(pg);
    pg.add(mesh(new THREE.SphereGeometry(.05,8,6),hair,0,0,0));
    const t1=mesh(cyl(.04,.025,.3,6),hair,0,-.16,0);pg.add(t1);
  }
  // arms
  const arms={};
  for(const sx of[1,-1]){
    const sh=new THREE.Group();sh.position.set(sx*.27*bulk,.43,0);torso.add(sh);
    sh.add(mesh(new THREE.SphereGeometry(.075*bulk,10,8),top,0,0,0));
    sh.add(mesh(cyl(.062*bulk,.052*bulk,.3,10),top,0,-.15,0));
    const el=new THREE.Group();el.position.y=-.3;sh.add(el);
    el.add(mesh(new THREE.SphereGeometry(.052*bulk,8,6),skin,0,0,0));
    el.add(mesh(cyl(.052*bulk,.042*bulk,.27,10),skin,0,-.135,0));
    el.add(mesh(cyl(.056*bulk,.05*bulk,.1,10),M(0xe8e8e8),0,-.22,0));
    const fist=mesh(new THREE.SphereGeometry(.066*bulk,10,8),skin,0,-.31,0);el.add(fist);
    arms[sx>0?'L':'R']={sh,el,fist};
  }
  const legs={};
  for(const sx of[1,-1]){
    const hp=new THREE.Group();hp.position.set(sx*.1*bulk,-.02,0);pelvis.add(hp);
    hp.add(mesh(cyl(.098*bulk,.074*bulk,.46,10),pant,0,-.225,0));
    const kn=new THREE.Group();kn.position.y=-.45;hp.add(kn);
    kn.add(mesh(new THREE.SphereGeometry(.07*bulk,8,6),pant,0,0,0));
    kn.add(mesh(cyl(.074*bulk,.062*bulk,.22,10),pant,0,-.11,0));
    kn.add(mesh(cyl(.052*bulk,.045*bulk,.26,10),skin,0,-.3,0));
    const foot=new THREE.Group();foot.position.y=-.43;kn.add(foot);
    foot.add(mesh(new THREE.BoxGeometry(.11*bulk,.06,.26),skin,0,-.02,.06));
    foot.add(mesh(new THREE.BoxGeometry(.114*bulk,.025,.27),dark,0,-.06,.06));
    const sole=new THREE.Object3D();sole.position.set(0,-.07,.05);foot.add(sole);
    legs[sx>0?'L':'R']={hp,kn,foot,sole};
  }
  for(const o of[pelvis,torso,arms.L.sh,arms.R.sh,legs.L.hp,legs.R.hp])o.rotation.order='YXZ';
  const samples=[{o:legs.L.sole,off:0},{o:legs.R.sole,off:0},{o:headC,off:.14},{o:chestC,off:.2},{o:pelvis,off:.17},{o:arms.L.fist,off:.07},{o:arms.R.fist,off:.07}];
  const shadow=new THREE.Mesh(new THREE.PlaneGeometry(1.5,1.5),new THREE.MeshBasicMaterial({map:shadowTex,transparent:true,depthWrite:false,fog:false}));
  shadow.rotation.x=-PI/2;shadow.position.y=.02;
  return{root,pelvis,torso,head,arms,legs,chestC,samples,shadow};
}

G.latFor=function(f){

  f.vx=f.vz=0;
}

/* ---------------- AI ---------------- */
function makeAI(f,lv){return{f,lv,tmr:rnd()*.4,blockT:0,bcr:false,chainT:0,jugT:0,lastAtk:-1,sideT:0};}
function clearInp(i){i.fwd=0;i.side=0;i.crouch=false;i.guard=false;i.P=false;i.K=false;}
function aiUpdate(a,o,dt){
  const f=a.f,inp=f.inp,lv=a.lv;
  if(!G.canAct){clearInp(inp);return;}
  a.tmr-=dt;a.blockT-=dt;a.chainT-=dt;a.jugT-=dt;a.sideT-=dt;
  const dist=f.dist;
  // reactive defence
  if(o.state==='attack'&&o.move&&o.atkId!==a.lastAtk){
    a.lastAtk=o.atkId;
    if(dist<o.move.range+.5&&f.state==='free'){
      const r=rnd();
      if(r<lv.block){a.blockT=o.move.dur*.85+.1;a.bcr=o.move.level==='l';}
      else if(r<lv.block+lv.dodge){a.sideT=.4;a.sideDir=rnd()<.5?1:-1;}
    }
  }
  if(o.state==='throw'&&o.atkId!==a.lastAtk){a.lastAtk=o.atkId;}
  if(a.blockT>0&&f.state==='free'){inp.guard=true;inp.crouch=a.bcr;inp.fwd=0;inp.side=0;return;}
  inp.guard=false;
  if(a.sideT>0&&f.state==='free'){inp.side=a.sideDir;inp.fwd=0;inp.crouch=false;return;}
  // juggle
  if(o.state==='air'&&dist<2&&(f.state==='free'||f.state==='attack')){
    inp.fwd=dist>1.2?1:0;inp.crouch=false;
    if(a.jugT<=0&&f.state==='free'){a.jugT=.1;f.press(rnd()<.8?'P':'K');}
    if(f.state==='attack'&&f.hitConnected&&a.jugT<=0){a.jugT=.08;f.press(rnd()<.85?'P':'K');}
    return;
  }
  // chains
  if(f.state==='attack'&&f.hitConnected&&f.move.next&&a.chainT<=0){
    a.chainT=.2;
    if(rnd()<lv.chain){const b=rnd()<.55?'P':'K';if(f.move.next[b])f.press(b);}
    return;
  }
  if(f.state!=='free')return;
  const myEdge=RING-Math.max(Math.abs(f.x),Math.abs(f.z));
  if(myEdge<1.7&&a.tmr<=0&&rnd()<.55){const lt=G.latFor(f);const sg=(lt.x*-f.x+lt.z*-f.z)>=0?1:-1;inp.side=sg;inp.fwd=0;inp.crouch=false;a.tmr=.3+rnd()*.2;return;}
  if(G.mode==='demo'&&G.round===1&&!G.showDone&&G.pt>6&&dist<1.5&&o.state==='free'&&f.idx===0){G.showDone=true;inp.fwd=1;inp.crouch=false;inp.guard=false;f.press('P');a.tmr=.5;return;}
  if(a.tmr>0)return;
  a.tmr=(.1+rnd()*.3)/lv.aggr;
  inp.crouch=false;inp.side=0;inp.fwd=0;
  const r=rnd();
  const edge=RING-Math.max(Math.abs(o.x),Math.abs(o.z));
  if(dist>2.7){inp.fwd=1;if(r<.18)inp.side=rnd()<.5?1:-1;}
  else if(dist>1.8){
    if(edge<2&&r<.12){inp.fwd=1;f.press('K');}
    else if(r<.1){inp.fwd=1;f.press('K');}
    else if(r<.42)f.press('K');
    else if(r<.78)inp.fwd=1;
    else if(r<.9)inp.fwd=-1;
    else inp.side=rnd()<.5?1:-1;
  }else{
    if(edge<1.8&&r<.1){inp.fwd=1;f.press('K');}
    else if(r<.26)f.press('P');
    else if(r<.42){inp.fwd=1;f.press('P');}
    else if(r<.52)f.press('T');
    else if(r<.6){inp.crouch=true;f.press('K');}
    else if(r<.66){inp.crouch=true;f.press('P');}
    else if(r<.62){inp.fwd=1;f.press('K');}
    else if(r<.82)f.press('K');
    else if(r<.9)inp.fwd=-1;
    else inp.side=rnd()<.5?1:-1;
  }
}
const LV_DEMO={block:.34,dodge:.08,chain:.7,aggr:1.25};
const LV_CPU={block:.4,dodge:.1,chain:.6,aggr:1.0};

/* ---------------- Game flow ---------------- */
const fighters=ROSTER.map((d,i)=>new Fighter(d,i));
G.fighters=fighters;
function layoutSelect(){
  G.mode='select';G.phase='select';G.canAct=false;
  fighters.forEach((f,i)=>{f.reset((i-1)*2.6,0,0);f.m.root.visible=true;f.state='select';f.selected=false;f.hp=f.maxhp;});
}
function setBattle(i1,i2,mode){
  G.mode=mode;
  fighters.forEach(f=>{f.m.root.visible=false;f.m.shadow.visible=false;f.selected=false;});
  const a=fighters[i1],b=fighters[i2];
  a.idx=0;b.idx=1;a.m.root.visible=b.m.root.visible=true;
  G.f=[a,b];
  G.ai[0]=mode==='demo'?makeAI(a,LV_DEMO):null;
  G.ai[1]=makeAI(b,mode==='demo'?LV_DEMO:LV_CPU);
  G.wins=[0,0];G.round=1;G.matchEndT=0;
  startRound();
}
function startDemo(){
  const i1=(Math.random()*3)|0;let i2;do{i2=(Math.random()*3)|0;}while(i2===i1);
  setBattle(i1,i2,'demo');G.demoT=0;
}
function startGame(sel){
  let o;do{o=(Math.random()*3)|0;}while(o===sel);
  setBattle(sel,o,'play');Sfx.bell();G.tipT=0;
}
function startRound(){
  const[a,b]=G.f;
  a.reset(-1.7,0,PI/2);b.reset(1.7,0,-PI/2);
  a.idx=0;b.idx=1;a.state=b.state='free';
  G.phase='intro';G.pt=0;G.timer=ROUND_TIME;G.canAct=false;G.msg=null;G.combo=[0,0];G.comboT=[0,0];G.zoom=1.5;G.slow=0;G.counterT=0;
  G.camAng=0;G.lastWin=-1;if(G.round===1)G.showDone=false;
}
function endRound(win,reason){
  G.phase='ko';G.pt=0;G.canAct=false;G.reason=reason;G.winner=win;G.counterT=0;
  if(win>=0)G.wins[win]++;
  G.slow=reason==='K.O.'?1.5:(reason==='RING OUT'?1.2:0);
  Sfx.gong();
  if(reason==='K.O.'||reason==='RING OUT'){G.shake=.35;}
}
let _pm=null;
G.step=function(dt){
  G.real+=dt;
  if(_pm!==G.mode){_pm=G.mode;document.body.classList.toggle('playing',G.mode==='play');}
  if(G.hitstop>0){G.hitstop-=dt;updateFx(dt);G.shake*=.9;return;}
  let sdt=dt;
  if(G.slow>0){sdt=dt*.3;G.slow-=dt;}
  G.time+=sdt;
  G.shake*=Math.exp(-6*sdt);
  if(G.comboT[0]>0)G.comboT[0]-=sdt;if(G.comboT[1]>0)G.comboT[1]-=sdt;if(G.counterT>0)G.counterT-=sdt;
  if(G.mode==='select'){
    fighters.forEach((f,i)=>{f.selected=(i===G.sel);f.state='select';f.update(sdt,fighters[(i+1)%3]);});
    G.selT+=sdt;updateFx(sdt);return;
  }
  const[a,b]=G.f;
  G.pt+=sdt;
  if(G.phase==='intro'){
    G.zoom=lerp(G.zoom,1,1-Math.exp(-3*sdt));
    if(G.pt>.2&&!G._r){G._r=1;Sfx.bell();}
    if(G.pt>1.5&&!G._f){G._f=1;Sfx.fight();}
    if(G.pt>2.3){G.phase='fight';G.canAct=true;G._r=G._f=0;}
  }else if(G.phase==='fight'){
    G.timer-=sdt;
    const fa=a.state==='fall',fb=b.state==='fall';
    if(fa||fb){if(fa&&fb)endRound(a.hp>=b.hp?0:1,'RING OUT');else endRound(fa?1:0,'RING OUT');}
    else if(a.hp<=0||b.hp<=0){endRound(a.hp<=0?1:0,'K.O.');}
    else if(G.timer<=0){G.timer=0;endRound(a.hp/a.maxhp>=b.hp/b.maxhp?0:1,'TIME UP');}
  }else if(G.phase==='ko'){
    G.zoom=lerp(G.zoom,G.reason==='RING OUT'?1.05:.8,1-Math.exp(-2*sdt));
    if(G.pt>.5&&G.winner>=0){const w=G.f[G.winner],l=G.f[1-G.winner];
      if(w.state==='free'||w.state==='attack'||w.state==='hit'||w.state==='block'){w.state='win';w.t=0;w.vx=w.vz=0;}
      if(l.state==='free'||l.state==='block'||l.state==='hit'){if(l.hp<=0){}else{l.state='lose';l.t=0;}}}
    if(G.pt>3.4){
      if(G.wins[0]>=2||G.wins[1]>=2){G.phase='match';G.pt=0;G.zoom=.85;Sfx.bell();}
      else{G.round++;startRound();}
    }
  }else if(G.phase==='match'){
    G.matchEndT+=sdt;
    if(G.pt>5.5){if(G.mode==='play'){startDemo();}else startDemo();}
  }
  // AI & fighters
  for(let i=0;i<2;i++){if(G.ai[i])aiUpdate(G.ai[i],G.f[1-i],sdt);}
  for(let i=0;i<2;i++){const f=G.f[i];f.update(sdt,G.f[1-i]);}
  for(let i=0;i<2;i++){const f=G.f[i];if(f.state==='thrown')updateThrown(f,G.f[1-i]);}
  // body separation
  const ok=f=>f.y<.5&&f.state!=='thrown'&&f.state!=='fall'&&f.state!=='ko'&&f.state!=='down';
  if(ok(a)&&ok(b)){
    const dx=b.x-a.x,dz=b.z-a.z,d=Math.hypot(dx,dz)||.001,min=.82;
    if(d<min){const p=(min-d)/2,nx=dx/d,nz=dz/d;a.x-=nx*p;a.z-=nz*p;b.x+=nx*p;b.z+=nz*p;}
  }
  updateFx(sdt);
};

/* ---------------- Camera ---------------- */
const camState={x:0,z:0,d:7,y:1};
function updateCamera(dt){
  if(G.mode==='select'){
    const t=G.real*.3;
    camera.position.set(Math.sin(t)*.8,1.5,6.6);camera.lookAt(0,1.05,0);camera.fov=40;camera.updateProjectionMatrix();return;
  }
  const[a0,b0]=G.f;
  const cl=v=>clamp(v,-RING-3.5,RING+3.5);
  const a={x:cl(a0.x),z:cl(a0.z),y:Math.max(a0.y,-4)},b={x:cl(b0.x),z:cl(b0.z),y:Math.max(b0.y,-4)};
  let dx=b.x-a.x,dz=b.z-a.z;const L=Math.hypot(dx,dz)||1;
  const tgt=Math.atan2(dz,dx);
  if(G.phase==='intro'&&G.pt<.05){G.camAng=tgt;}
  G.camAng+=angDiff(G.camAng,tgt)*(1-Math.exp(-5*dt));
  const cdx=Math.cos(G.camAng),cdz=Math.sin(G.camAng);
  G.camF={x:cdz,z:-cdx};
  const mx=(a.x+b.x)/2,mz=(a.z+b.z)/2;
  let my=clamp(((a.y+.95)+(b.y+.95))/2,-9,3);
  const flr=(G.phase==='ko'&&G.reason==='RING OUT')?G.f.find(f=>f.state==='fall'&&f.m.root.visible):null;
  if(flr)my=clamp(Math.max(flr.y,-8.2)*1.15,-7,3);
  const td=Math.max(6.3,L*.95+3.4)*G.zoom;
  camState.d=lerp(camState.d,td,1-Math.exp(-4*dt));
  camState.x=lerp(camState.x,mx,1-Math.exp(-8*dt));camState.z=lerp(camState.z,mz,1-Math.exp(-8*dt));camState.y=lerp(camState.y,my,1-Math.exp(-(flr?9:5)*dt));
  const sh=G.shake;
  let px=camState.x-G.camF.x*camState.d,pz=camState.z-G.camF.z*camState.d,py=1.6+clamp(camState.y,0,3)*.55+(G.zoom>1.05?(G.zoom-1)*1.2:0);
  px+=(Math.random()-.5)*sh;py+=(Math.random()-.5)*sh;pz+=(Math.random()-.5)*sh;
  camera.position.set(px,py,pz);
  camera.lookAt(camState.x+(Math.random()-.5)*sh*.3,.95+camState.y*.6,camState.z);
  camera.fov=36;camera.updateProjectionMatrix();
}
function updatePetals(dt){
  const p=petalGeo.attributes.position.array;
  for(let i=0;i<PET_N;i++){
    const v=petalV[i];v[2]+=dt*2;
    p[i*3]+=Math.sin(v[2])*dt*.5+v[0]*dt*.7;p[i*3+1]-=v[1]*dt;p[i*3+2]+=Math.cos(v[2]*.7)*dt*.4;
    if(p[i*3+1]<-.5){p[i*3+1]=8+rnd()*2;p[i*3]=camState.x+(rnd()-.5)*26;p[i*3+2]=camState.z+(rnd()-.5)*26;}
  }
  petalGeo.attributes.position.needsUpdate=true;
}

/* ---------------- HUD ---------------- */
const FONT='"Arial Black","Impact","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif';
function txt(s,x,y,size,fill,stroke,align,lw){
  hud.font='900 italic '+size+'px '+FONT;hud.textAlign=align||'center';hud.textBaseline='middle';

function para(x0,y0,x1,y1,sl){hud.beginPath();hud.moveTo(x0+sl,y0);hud.lineTo(x1+sl,y0);hud.lineTo(x1-sl,y1);hud.lineTo(x0-sl,y1);hud.closePath();}
const dispHp=[1,1];
function drawBar(side,f,dt){
  const y0=34,h=30,sl=14;
  const frac=f.hp/f.maxhp;dispHp[side]+=(frac-dispHp[side])*Math.min(1,dt*3);if(dispHp[side]<frac)dispHp[side]=frac;
  const L=side===0?70:700,R=side===0?580:1210;

    if(Math.sin(t*5)>-.2){

      hud.save();hud.globalAlpha=clamp(1-(G.tipT-10)/4,0,1);hud.fillStyle='rgba(0,0,0,.55)';hud.fillRect(W/2-440,H-62,880,42);hud.restore();
      hud.save();hud.globalAlpha=clamp(1-(G.tipT-10)/4,0,1);
      txt('←→ 移動   ↑ 回り込み(E:逆)   ↓ しゃがみ   J:パンチ  K:キック  L:ガード  Space:投げ   →+J:打ち上げ  →+K:回し蹴り',W/2,H-41,19,'#fff',null);hud.restore();
    }
  }
}
const selRects=[];
function drawSelect(){
  hud.fillStyle='rgba(10,10,30,.35)';hud.fillRect(0,0,W,H);
  txt('SELECT YOUR FIGHTER',W/2,70,64,'#fff','#000');
  txt(IS_TOUCH?'TAP A FIGHTER':'← →  選択   Enter / J で決定',W/2,125,26,'#ffd84a','#000');
  for(let i=0;i<3;i++){
    const d=ROSTER[i],cx=W/2+(i-1)*(W*.33),on=i===G.sel;
    hud.save();hud.globalAlpha=on?1:.75;
    hud.fillStyle=on?'rgba(0,0,0,.65)':'rgba(0,0,0,.4)';hud.fillRect(cx-170,H-190,340,150);
    hud.strokeStyle=on?d.col:'#fff';hud.lineWidth=on?7:3;hud.strokeRect(cx-170,H-190,340,150);
    txt(d.name,cx,H-150,54,'#fff','#000');txt(d.jp,cx,H-102,34,d.col,'#000');
    txt(d.tag,cx,H-65,22,'#ffd84a','#000');
    hud.restore();
    if(on){hud.save();hud.fillStyle=d.col;hud.beginPath();hud.moveTo(cx-18,H-215);hud.lineTo(cx+18,H-215);hud.lineTo(cx,H-195);hud.fill();hud.restore();}
  }
}

/* ---------------- Controls ---------------- */
let userActive=false;
function wake(){
  Sfx.init();
  if(!userActive){userActive=true;}
}
function p1(){return(G.mode==='play'&&G.f[0])?G.f[0]:null;}
function setInpFromKeys(){
  const f=p1();if(!f||!G.canAct&&false)return;
  const i=f.inp;
  i.fwd=(keys.ArrowRight||keys.KeyD?1:0)-(keys.ArrowLeft||keys.KeyA?1:0);
  i.side=(keys.ArrowUp||keys.KeyW?1:0)-(keys.ShiftLeft||keys.ShiftRight||keys.KeyE?1:0);
  i.crouch=!!(keys.ArrowDown||keys.KeyS);
  i.guard=!!(keys.KeyL||keys.KeyC);
  i.P=!!(keys.KeyJ||keys.KeyZ);i.K=!!(keys.KeyK||keys.KeyX);
  // merge touch
  if(touchState.active){
    if(touchState.fwd)i.fwd=touchState.fwd;
    if(touchState.side)i.side=touchState.side;
    if(touchState.crouch)i.crouch=true;
  }
  if(touchState.guard)i.guard=true;
  if(touchState.out)i.side=-1;
  if(touchState.P)i.P=true;if(touchState.K)i.K=true;
}
const touchState={active:false,fwd:0,side:0,crouch:false,guard:false,P:false,K:false,out:false};
function menuAction(code){
  if(G.mode==='demo'){
    if(['F5','F11','F12','ControlLeft','ControlRight','MetaLeft','MetaRight','AltLeft','AltRight'].includes(code))return false;
    layoutSelect();G.sel=1;Sfx.ui();return true;
  }
  if(G.mode==='select'){
    if(code==='ArrowLeft'||code==='KeyA'){G.sel=(G.sel+2)%3;Sfx.ui();}
    else if(code==='ArrowRight'||code==='KeyD'){G.sel=(G.sel+1)%3;Sfx.ui();}
    else if(code==='Enter'||code==='Space'||code==='KeyJ'||code==='KeyZ'){startGame(G.sel);}
    else if(code==='Escape'){startDemo();}
    return true;
  }
  return false;
}
window.addEventListener('keydown',e=>{
  wake();
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code))e.preventDefault();
  if(e.repeat){return;}
  if(G.mode!=='play'){menuAction(e.code);return;}
  keys[e.code]=true;
  const f=p1();if(!f)return;
  setInpFromKeys();
  if(e.code==='KeyJ'||e.code==='KeyZ')f.press('P');
  else if(e.code==='KeyK'||e.code==='KeyX')f.press('K');
  else if(e.code==='KeyL'||e.code==='KeyC')f.press('G');
  else if(e.code==='Space'||e.code==='KeyU'||e.code==='KeyV')f.press('T');
  else if(e.code==='KeyM')Sfx.toggle();
  else if(e.code==='Escape'){startDemo();}
});
window.addEventListener('keyup',e=>{keys[e.code]=false;if(G.mode==='play')setInpFromKeys();});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});
document.addEventListener('touchend',()=>{Sfx.init();},{passive:true});
document.addEventListener('visibilitychange',()=>{last=performance.now();});
window.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// stage pointer (menus)
function stagePos(e){const r=stageEl.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
stageEl.addEventListener('pointerdown',e=>{
  wake();
  if(e.target.closest('.btn')||e.target.closest('.ibtn'))return;
  if(G.mode==='demo'){layoutSelect();G.sel=1;Sfx.ui();e.preventDefault();return;}
  if(G.mode==='select'){
    const p=stagePos(e);const i=clamp(Math.floor(p.x/(W/3)),0,2);
    if(p.y>180){G.sel=i;startGame(i);}
  }
});
// touch controls
const stickBase=document.getElementById('stickBase'),knob=document.getElementById('stickKnob');
let stickId=null,sx0=0,sy0=0;
const zoneL=document.getElementById('zoneL');
function updateStick(p){
  const dx=p.x-sx0,dy=p.y-sy0,r=Math.hypot(dx,dy),m=Math.min(r,70);
  const nx=r>0?dx/r*m:0,ny=r>0?dy/r*m:0;
  knob.style.left=(53+nx)+'px';knob.style.top=(53+ny)+'px';
  const th=24;
  touchState.fwd=dx>th?1:dx<-th?-1:0;
  touchState.side=dy<-th*1.3?1:0;
  touchState.crouch=dy>th*1.3;
  touchState.active=true;setInpFromKeys();
}
zoneL.addEventListener('pointerdown',e=>{
  wake();if(G.mode!=='play'){return;}
  if(stickId!==null)return;stickId=e.pointerId;try{zoneL.setPointerCapture(e.pointerId);}catch(_){}
  const p=stagePos(e);sx0=p.x;sy0=p.y;
  stickBase.style.display='block';stickBase.style.left=sx0+'px';stickBase.style.top=sy0+'px';
  updateStick(p);e.preventDefault();
});
zoneL.addEventListener('pointermove',e=>{if(e.pointerId!==stickId)return;updateStick(stagePos(e));e.preventDefault();});
function endStick(e){if(e.pointerId!==stickId)return;stickId=null;stickBase.style.display='none';touchState.fwd=0;touchState.side=0;touchState.crouch=false;touchState.active=false;setInpFromKeys();}
zoneL.addEventListener('pointerup',endStick);zoneL.addEventListener('pointercancel',endStick);
function bindBtn(id,key,onDown){
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{
    wake();e.preventDefault();e.stopPropagation();try{el.setPointerCapture(e.pointerId);}catch(_){}el.classList.add('on');
    if(G.mode!=='play')return;
    if(key)touchState[key]=true;setInpFromKeys();
    const f=p1();if(f&&onDown)onDown(f);
  });
  const up=e=>{el.classList.remove('on');if(key){touchState[key]=false;if(G.mode==='play')setInpFromKeys();}};
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
}
bindBtn('bP','P',f=>f.press('P'));
bindBtn('bK','K',f=>f.press('K'));
bindBtn('bG','guard',f=>f.press('G'));
bindBtn('bT',null,f=>f.press('T'));
bindBtn('bS','out',null);
const bSnd=document.getElementById('bSnd'),bFs=document.getElementById('bFs');
bSnd.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();wake();bSnd.textContent=Sfx.toggle()?'✕':'♪';});
bFs.addEventListener('pointerdown',e=>{
  e.preventDefault();e.stopPropagation();wake();
  const el=document.documentElement;
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){(document.exitFullscreen||document.webkitExitFullscreen).call(document);}
    else{const rq=el.requestFullscreen||el.webkitRequestFullscreen;if(rq){const pr=rq.call(el);if(pr&&pr.then)pr.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(_){}}).catch(()=>{});}
      else alert('iPhone/iPad は Safari の共有ボタン →「ホーム画面に追加」で全画面のアプリとして遊べます。');}
  }catch(_){}
});
if(!document.documentElement.requestFullscreen&&!document.documentElement.webkitRequestFullscreen){bFs.textContent='ⓘ';}

/* ---------------- PWA bits (manifest + icon generated in code) ---------------- */

    g.fillStyle='#ffc23a';g.font='900 italic 120px Arial Black,Impact,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('Z',96,100);

    const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));document.head.appendChild(ml);
  }catch(e){}
})();

/* ---------------- main loop ---------------- */
const STEP=1/60;let acc=0,last=performance.now();
function renderFrame(dt){
  for(const f of fighters)if(f.m.root.visible)f.render(dt);
  updateCamera(dt);updatePetals(dt);
  renderer.render(scene,camera);
  drawHUD(dt);
}
let qAcc=0,qN=0,qScale=1;
function frame(now){
  requestAnimationFrame(frame);
  let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;acc+=dt;
  qAcc+=dt;qN++;if(qN>=90){const avg=qAcc/qN;if(avg>.026&&qScale>.55){qScale*=.85;window.__q=qScale;resize();}qAcc=0;qN=0;}
  let n=0;
  while(acc>=STEP&&n<4){if(G.mode==='play')setInpFromKeys();G.step(STEP);acc-=STEP;n++;}
  if(n>=4)acc=0;
  renderFrame(dt);
}
G.sim=function(sec){const n=Math.round(sec/STEP);for(let i=0;i<n;i++){G.step(STEP);}for(const f of fighters)if(f.m.root.visible)f.render(STEP);};
G.P=P;G.MOVES=MOVES;G.renderFrame=renderFrame;G.THREE=THREE;G.startDemo=startDemo;G.startGame=startGame;G.layoutSelect=layoutSelect;G.scene=scene;G.camera=camera;
window.__G=G;

startDemo();
requestAnimationFrame(t=>{last=t;frame(t);});
})();
</script>
